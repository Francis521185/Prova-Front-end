<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>BYD Brasil</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Cabeçalho e menu -->
    <header>
      <div class="barra-superior">
        <img src="img/fill.svg" alt="Pesquisar" />
        <img src="img/separacao.svg" alt="" />
        <img src="img/global.svg" alt="" />
        <span>Global</span>
      </div>
      <div class="cabecalho">
        <a href="#inicio" class="logo">
          <img src="./img/logo_byd.svg" alt="BYD" />
        </a>
        <nav class="menu">
          <a href="#modelos">Modelos</a>
          <a href="#tecnologia">Tecnologia</a>
          <a href="#ofertas">Ofertas</a>
          <a href="#test-drive">Test Drive</a>
          <a href="#aluguel">Aluguel BYD Mais</a>
          <a href="#metaverso">Metaverso BYD</a>
        </nav>
      </div>
    </header>

    <main>
      <!-- Banner principal -->

      <section id="inicio">
        <div class="banner">
          <button class="seta-esquerda" aria-label="Imagem anterior">
            <img src="./img/seta_esquerda.svg" alt="" />
          </button>

          <img
            src="img/banner_img.png"
            alt="Campanha BYD"
            class="banner-imagem"
          />

          <button class="seta-direita" aria-label="Próxima imagem">
            <img src="img/seta_direita.svg" alt="" />
          </button>
        </div>
      </section>

      <section id="sobre" class="sobre">
        <div class="sobre-conteudo">
          <!-- Conteúdo da apresentação -->
        </div>
      </section>

      <section id="historia">
        <!-- Conteúdos e imagens -->
      </section>

      <section id="modelos">
        <!-- Veículos e cards -->
      </section>

      <section id="interesse">
        <!-- Formulário de interesse -->
      </section>
    </main>

    <footer>
      <!-- Rodapé -->
    </footer>
  </body>
</html>
